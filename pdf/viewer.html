<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>UniPDF Pro</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/layers.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>
    <div id="notes-sidebar"></div>
    <div id="pdf-sidebar" class="pos-left closed">
        <div class="sidebar-tabs">
            <button id="tab-outline" class="active">Índice</button>
            <button id="tab-thumbnails">Páginas</button>
            <button id="btn-sidebar-side" title="Mudar lado (M)" style="flex: 0 0 40px; border-left: 1px solid #333;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; margin: 0 auto; display: block;"><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><path d="M9 3v18"/></svg>
            </button>
        </div>
        <div class="sidebar-content">
            <div id="outline-view"></div>
            <div id="thumbnails-view" class="hidden"></div>
        </div>
    </div>
    <div id="reading-ruler"></div>
    <div id="search-panel" class="hidden">
        <input type="text" id="search-input" placeholder="Pesquisar (usa vírgula para várias palavras)...">
        <span id="search-counter"></span>
        
        <button id="btn-search-prev" title="Anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </button>
        <button id="btn-search-next" title="Seguinte (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span class="divider">|</span>
        <button id="btn-search-close" title="Fechar (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </div>

    <div id="mini-header" class="mode-ghost">
        <div class="header-left">
            <button id="btn-toggle-sidebar" title="Alternar Barra Lateral (Índice / Miniaturas)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            </button>
            <span class="divider">|</span>
            <span id="page-display">
                <input type="number" id="page-input" value="1"> / <span id="page-count">0</span>
            </span>
            <span class="divider">|</span>
            <button id="btn-bold-mode" title="Leitura Rápida (Bionic)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </button>

            <button id="btn-focus-mode" title="Modo Foco (Desligado / Lanterna / Linha)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16"/><path d="M8 8h8"/><path d="M8 16h8"/></svg>
            </button>
            <span class="divider">|</span>
            <button id="btn-add-note" title="Criar Nova Nota (Centro da Página)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button id="btn-copy-url" title="Copiar Caminho (Esquerdo: Win | Direito: Linux)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
        </div>
        <div id="annotation-toolbar">
            
            <div id="annotation-options" class="hidden">
                <button class="opt-btn opt-mode active" data-val="highlight" title="Pintar (Fundo)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
                </button>
                <button class="opt-btn opt-mode" data-val="underline" title="Sublinhar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" x2="20" y1="20" y2="20"/></svg>
                </button>
                
                <span class="divider">|</span>
                
                <!-- Cores -->
                <button class="opt-color active" data-val="#ffeb3b" style="background: #ffeb3b;" title="Amarelo"></button>
                <button class="opt-color" data-val="#8be28b" style="background: #8be28b;" title="Verde"></button>
                <button class="opt-color" data-val="#80d8ff" style="background: #80d8ff;" title="Azul"></button>
                <button class="opt-color" data-val="#ff9f9f" style="background: #ff9f9f;" title="Vermelho"></button>

                <span class="divider">|</span>
                
                <!-- Espessura -->
                <button class="opt-btn opt-size" data-val="2" title="Fina">
                    <svg viewBox="0 0 24 24" stroke="currentColor"><line x1="4" y1="12" x2="20" y2="12" stroke-width="2"/></svg>
                </button>
                <button class="opt-btn opt-size active" data-val="4" title="Média">
                    <svg viewBox="0 0 24 24" stroke="currentColor"><line x1="4" y1="12" x2="20" y2="12" stroke-width="4"/></svg>
                </button>
                <button class="opt-btn opt-size" data-val="7" title="Grossa">
                    <svg viewBox="0 0 24 24" stroke="currentColor"><line x1="4" y1="12" x2="20" y2="12" stroke-width="7"/></svg>
                </button>
            </div>

            <button id="btn-annotate" title="Ativar marcação">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 20 4.5-1L19 8.5a2.12 2.12 0 0 0-3-3L5.5 16 4 20Z"/><path d="m14.5 6.5 3 3"/></svg>
            </button>
            <button id="btn-eraser" title="Ativar borracha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21 10.5-10.5a2.12 2.12 0 0 0 0-3L14.5 5.5a2.12 2.12 0 0 0-3 0L4 13a2.12 2.12 0 0 0 0 3L7 19h10"/><path d="m16 21 3-3"/></svg>
            </button>
        </div>
        
        <div class="zoom-controls">
            <span class="divider">|</span>

            <button id="btn-header-mode" title="Mudar modo (H)"></button>
            <span class="divider">|</span>
            <button id="btn-zoom-out" title="Diminuir (Ctrl + -)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
            </button>
            <input type="text" id="zoom-percent" value="100%">
            <button id="btn-zoom-in" title="Aumentar (Ctrl + +)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
            </button>
            <span class="divider">|</span>
            <button id="btn-fit-width" title="Ajustar à Largura">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 3v18"/><path d="M3 3v18"/><path d="M17 12H7"/><path d="M14 15l3-3-3-3"/><path d="M10 9l-3 3 3 3"/>
                </svg>
            </button>
            <button id="btn-fit-height" title="Ajustar à Altura">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21h18"/><path d="M3 3h18"/><path d="M12 17V7"/><path d="M15 14l-3 3-3-3"/><path d="M9 10l3-3 3 3"/>
                </svg>
            </button>
            <span class="divider">|</span>
            <button id="btn-fullscreen" title="Ecrã Inteiro (F11)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="viewport">
        <div id="pages-container"></div>
    </div>

    <input type="range" id="lateral-slider" min="-100" max="100" value="0">
    <input type="file" id="file-input" style="display:none" accept="application/pdf">

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="../search/js/content.js"></script>
</body>
</html>
