<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/layers.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="../search/css/content.css">
    <script src="lib/pdf_lib/pdf-lib.min.js"></script>
</head>
<body>
    <div id="notes-sidebar"></div>
    <div id="pdf-sidebar" class="pos-left closed">
        <div class="sidebar-tabs">
            <button id="tab-outline" class="active">Índ.</button>
            <button id="tab-thumbnails">Págs.</button>
            <button id="tab-figures">Figs.</button>
            <button id="tab-refs">Biblio.</button>
            <button id="btn-sidebar-side" title="Mudar lado (M)">
                <svg width="28" height="22" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 6H4" />
                    <path d="M16 6H24" />
                    <path d="M4 18H12" />
                    <path d="M24 18H16" />
                    <path d="M3 6L8 2V10L3 6Z" fill="currentColor" stroke="none" />
                    <path d="M25 6L20 2V10L25 6Z" fill="currentColor" stroke="none" />
                    <path d="M13 18L8 14V22L13 18Z" fill="currentColor" stroke="none" />
                    <path d="M15 18L20 14V22L15 18Z" fill="currentColor" stroke="none" />
                </svg>
            </button>
            <button id="btn-close-sidebar" title="Fechar índice">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </div>
        <div class="sidebar-content">
            <div id="outline-view"></div>
            <div id="thumbnails-view" class="hidden"></div>
            <div id="figures-view" class="hidden">
                <div id="figures-toolbar-wrapper">
                    <div class="figures-hover-zone"></div>
                    <div class="figures-toolbar">
                        <div style="display: flex; gap: 6px; align-items: right; justify-content: flex-end;">
                            <button id="btn-figures-search-toggle" title="Pesquisar" style="background: #333; border: 1px solid #444; color: white; border-radius: 3px; padding: 5px 8px; cursor: pointer; display: flex;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px; height:14px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </button>
                            <button id="btn-figures-filter" title="Filtrar por Tipo" style="background: #333; border: 1px solid #444; color: white; border-radius: 3px; padding: 4px 8px; cursor: pointer; font-size: 12px; min-width: 65px;">
                                Tudo
                            </button>
                            <button id="btn-figures-sort" title="Modo de Ordenação" style="background: #333; border: 1px solid #444; color: white; border-radius: 3px; padding: 4px 8px; cursor: pointer; font-size: 12px; min-width: 80px;">
                                Agrupado
                            </button>
                        </div>
                        <div id="figures-search-container" class="hidden" style="margin-top: 8px;">
                            <input type="text" id="figures-search" placeholder="Pesquisar figura..." style="width: 100%; padding: 6px; border: 1px solid #444; border-radius: 3px; background: #1e1e1e; color: white; font-size: 12px; box-sizing: border-box;">
                        </div>

                    </div>
                </div>
                <div id="figures-list"></div>
            </div>
            <div id="refs-view" class="hidden"><div id="refs-list"></div></div>
        </div>
    </div>
    <div id="reading-ruler"></div>

    <div id="vertical-toolbar">
        <button id="btn-text-box" title="Escrever Texto / Formulários">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </button>
        <button id="btn-draw" title="Desenho livre">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 20 4.5-1L19 8.5a2.12 2.12 0 0 0-3-3L5.5 16 4 20Z"/><path d="m14.5 6.5 3 3"/></svg>
        </button>
        <button id="btn-annotate" title="Ativar marcação (Sublinhar/Pintar)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
        </button>
        
        <div class="v-divider"></div>
        
        <button id="btn-eraser" title="Ativar borracha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21 10.5-10.5a2.12 2.12 0 0 0 0-3L14.5 5.5a2.12 2.12 0 0 0-3 0L4 13a2.12 2.12 0 0 0 0 3L7 19h10"/><path d="m16 21 3-3"/></svg>
        </button>

        <!-- SECÇÃO VERTICAL: OPÇÕES DE TEXTO -->
        <div id="text-options" class="v-options-group hidden">
            <div class="v-divider"></div>
            <input type="number" id="opt-text-size" value="12" min="6" max="72" title="Tamanho da Fonte">
            <button class="opt-text-color active" data-val="#000000" style="background: #000; border: 1px solid #777;" title="Preto"></button>
            <button class="opt-text-color" data-val="#0376db" style="background: #0376db;" title="Azul"></button>
            <button class="opt-text-color" data-val="#e51400" style="background: #e51400;" title="Vermelho"></button>
            <div class="v-divider"></div>
            <button class="opt-text-align active" data-val="left" title="Alinhar à Esquerda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <button class="opt-text-align" data-val="center" title="Centro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <button class="opt-text-align" data-val="right" title="Alinhar à Direita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <div class="v-divider"></div>
            <button id="opt-text-widget" title="Modo Formulário (Criar Campo Editável)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></button>
        </div>

        <!-- SECÇÃO VERTICAL: OPÇÕES DE MARCAÇÃO E DESENHO -->
        <div id="annotation-options" class="v-options-group hidden">
            <div class="v-divider"></div>
            <button class="opt-btn opt-mode active" data-val="highlight" title="Pintar (Fundo)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
            <button class="opt-btn opt-mode" data-val="underline" title="Sublinhar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" x2="20" y1="20" y2="20"/></svg></button>
            
            <div class="v-divider opt-mode-divider"></div>
            
            <button class="opt-color active" data-val="#ffeb3b" style="background: #ffeb3b;" title="Amarelo"></button>
            <button class="opt-color" data-val="#8be28b" style="background: #8be28b;" title="Verde"></button>
            <button class="opt-color" data-val="#80d8ff" style="background: #80d8ff;" title="Azul"></button>
            <button class="opt-color" data-val="#ff9f9f" style="background: #ff9f9f;" title="Vermelho"></button>
            
            <div class="v-divider"></div>
            
            <button class="opt-btn opt-size" data-val="2" title="Fina"><svg viewBox="0 0 24 24" stroke="currentColor"><line x1="4" y1="12" x2="20" y2="12" stroke-width="2"/></svg></button>
            <button class="opt-btn opt-size active" data-val="4" title="Média"><svg viewBox="0 0 24 24" stroke="currentColor"><line x1="4" y1="12" x2="20" y2="12" stroke-width="4"/></svg></button>
            <button class="opt-btn opt-size" data-val="7" title="Grossa"><svg viewBox="0 0 24 24" stroke="currentColor"><line x1="4" y1="12" x2="20" y2="12" stroke-width="7"/></svg></button>
        </div>
    </div>

    <div id="mini-header" class="mode-ghost">
        <div class="header-left">
            <button id="btn-toggle-sidebar" title="Índice / Miniaturas">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            </button>
            <span class="divider">|</span>
            <span id="page-display">
                <input type="number" id="page-input" value="1"> / <span id="page-count">0</span>
            </span>
            <span class="divider">|</span>
            <button id="btn-focus-mode" title="Modo Foco (Desligado / Lanterna / Linha)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16"/><path d="M8 8h8"/><path d="M8 16h8"/></svg>
            </button>
            <span class="divider">|</span>
            <div class="dropdown-wrapper" id="download-dropdown-wrapper">
                <button id="btn-download" title="Opções de Transferência">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" x2="12" y1="15" y2="3"/>
                    </svg>
                </button>
                <div class="dropdown-menu" id="download-menu">
                    <button id="btn-dl-save">
                        <strong>Guardar</strong>
                    </button>
                    <button id="btn-dl-normal">
                        <strong>Guardar como</strong>
                    </button>
                    <button id="btn-dl-burn">
                        <strong>Guardar como (embutir Notas)</strong>
                        <span>(Notas e desenhos visíveis para todos)</span>
                    </button>
                    <button id="btn-dl-export">
                        <strong>Guardar como (Copiar Notas)</strong>
                        <span>(PDF novo, mantém as notas e desenhos)</span>
                    </button>
                </div>
            </div>
            <button id="btn-merge-pdf" title="Juntar PDF">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button id="btn-add-note" title="Criar Nova Nota (Centro da Página)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="12" y1="18" x2="12" y2="12"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
            </button>
            <button id="btn-copy-url" title="Copiar Caminho (Esquerdo: Win | Direito: Linux)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
        </div>

        <div class="zoom-controls">
            <span class="divider">|</span>
            <button id="btn-header-mode" title="Mudar modo (H)"></button>
            <span class="divider">|</span>
            <button id="btn-zoom-out" title="Diminuir (Ctrl + -)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
            </button>
            <input type="text" id="zoom-percent" value="100%">
            <button id="btn-zoom-in" title="Aumentar (Ctrl + +)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
            </button>
            <span class="divider">|</span>
            <button id="btn-fit-width" title="Ajustar à Largura">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 3v18"/><path d="M3 3v18"/><path d="M17 12H7"/><path d="M14 15l3-3-3-3"/><path d="M10 9l-3 3 3 3"/>
                </svg>
            </button>
            <button id="btn-fit-height" title="Ajustar à Altura">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21h18"/><path d="M3 3h18"/><path d="M12 17V7"/><path d="M15 14l-3 3-3-3"/><path d="M9 10l3-3 3 3"/>
                </svg>
            </button>
            <button id="btn-rotate-ccw" title="Rodar 90 graus para a esquerda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v8h8"/><path d="M12 7v5l3 2"/></svg>
            </button>
            <button id="btn-rotate-cw" title="Rodar 90 graus para a direita">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v8h-8"/><path d="M12 7v5l3 2"/></svg>
            </button>
            <span class="divider">|</span>
            <button id="btn-fullscreen" title="Ecrã Inteiro (F11)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="viewport">
        <div id="pages-container"></div>
    </div>

    <input type="range" id="lateral-slider" min="-100" max="100" value="0">
    <input type="file" id="file-input" style="display:none" accept="application/pdf">

    <input type="file" id="merge-file-input" style="display:none" accept="application/pdf">

    <div id="modal-merge" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Juntar PDF</h3>
            <p>Escolhe a página (do documento atual) a partir da qual desejas inserir o novo PDF. Se deixares em branco, será inserido no fim.</p>
            <input type="number" id="merge-page-input" min="1" placeholder="Ex: Adicionar ao fim">
            <div class="modal-actions">
                <button id="btn-merge-cancel">Cancelar</button>
                <button id="btn-merge-confirm">Inserir</button>
            </div>
        </div>
    </div>

    <div id="modal-preview" class="modal-overlay hidden">
        <div class="modal-content large-modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div style="display: flex; flex-direction: column;">
                    <h3 style="margin: 0;">Pré-visualização (Embutir Notas)</h3>
                    <p style="margin: 4px 0 0 0;">Como incluir Notas?</p>
                </div>
                
                <div style="display: flex; gap: 15px; background: #1e1e1e; padding: 8px 12px; border-radius: 6px; border: 1px solid #444;">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="radio" name="note-export-type" value="native" checked>
                        <span style="font-size: 13px;"><strong>Nativo (Adobe)</strong> - Ícone clássico</span>
                    </label>
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="radio" name="note-export-type" value="draw">
                        <span style="font-size: 13px;"><strong>Desenhado</strong> - Caixa amarela</span>
                    </label>
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="radio" name="note-export-type" value="none">
                        <span style="font-size: 13px;"><strong>Nenhuma</strong> - Exportar PDF limpo</span>
                    </label>
                </div>
            </div>

            <iframe id="preview-iframe" src=""></iframe>
            
            <div class="modal-actions">
                <button id="btn-preview-cancel">Cancelar</button>
                <button id="btn-preview-confirm">Confirmar e Guardar</button>
            </div>
        </div>
    </div>

    <div id="reference-preview" class="hidden">
        <div class="resizer-top"></div>
        <div class="resizer-left"></div>
        <div class="resizer-top-left"></div>
        <div class="ref-header">
            <div class="ref-header-group">
                <button id="btn-ref-prev" title="Página Anterior">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <strong style="margin: 0 5px;">Pré-visualização </span> (Pág. <span id="ref-page-number"></span>)</strong>
                <button id="btn-ref-next" title="Página Seguinte">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>

            <div class="ref-header-group">
                <button id="btn-ref-zoom-out" title="Menos Zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
                <span id="ref-zoom-display" style="font-size: 12px; color: #aaa;">150%</span>
                <button id="btn-ref-zoom-in" title="Mais Zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
                <span class="divider" style="margin: 0 5px; color: #555;">|</span>
                
                <button id="btn-ref-split" title="Modo Lado-a-Lado">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
                </button>
                <button id="btn-close-ref" class="btn-close-hover" title="Fechar Preview">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>
        <div class="ref-body">
            <div id="ref-wrapper" style="position: relative; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.3); text-align: left;">
                <canvas id="ref-canvas" style="box-shadow: none;"></canvas>
                <div id="ref-text-layer" class="textLayer"></div>
                <div id="ref-links-layer" class="pdf-links-layer"></div>
            </div>
        </div>
    </div>
    <div id="jump-highlight" class="hidden"></div>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="../search/js/content.js"></script>
</body>
</html>
